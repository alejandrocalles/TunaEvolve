training_config:
  _target_: shinka.train.configuration.DPOTrainingConfig
  model_id: "google/gemma-3-12b-it"
  base_output_dir: "dpo_checkpoints"
  logging_steps: 10

  evotune:
    _target_: shinka.train.configuration.EvoTuneConfig
    training_enabled: true
    num_generations_per_period: 2

  hyperparameters:
    _target_: shinka.train.configuration.DPOHyperparameters
    beta: 0.1
    learning_rate: 5.0e-6
    batch_size: 4
    gradient_accumulation_steps: 2
    epochs: 3
    lr_scheduler: "cosine"
    warmup_ratio: 0.1
    max_length: 2048
    max_prompt_length: 1024

  hardware:
    _target_: shinka.train.configuration.HardwareConfig
    fp16: true
    bf16: false

  lora:
    _target_: shinka.train.configuration.LoRAConfig
    enabled: true
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules:
      - "q_proj"
      - "v_proj"
      - "k_proj"
      - "o_proj"